<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detective Noir — Profile</title>
    <link rel="icon" href="/images/sherlock.png?v=2" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="css/profile.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page-backdrop" aria-hidden="true"></div>
    <div class="page-content">
      <header class="profile-navbar">
        <span class="brand">Detective Noir</span>
        <div class="nav-links">
          <a href="home.html" class="link-home">← Home</a>
          <button type="button" class="btn-logout" id="btnLogout">Logout</button>
        </div>
      </header>

      <main class="profile-main" role="main">
        <h1>Your profile</h1>
        <p class="intro">View your stats and edit your display name.</p>

        <section class="profile-stats-card" id="profileStatsCard">
          <h2 class="profile-stats-title">Your stats</h2>
          <div class="profile-stats-grid" id="profileStatsGrid">
            <div class="profile-stat">
              <span class="profile-stat-label">Username</span>
              <span class="profile-stat-value" id="statUsername">—</span>
            </div>
            <div class="profile-stat">
              <span class="profile-stat-label">Points</span>
              <span class="profile-stat-value" id="statPoints">0</span>
            </div>
            <div class="profile-stat">
              <span class="profile-stat-label">Clues collected</span>
              <span class="profile-stat-value" id="statClues">0 / 0</span>
            </div>
            <div class="profile-stat profile-stat--ending">
              <span class="profile-stat-label">Ending</span>
              <span class="profile-stat-value" id="statEnding">—</span>
            </div>
          </div>
        </section>

        <section class="profile-card">
          <h2 class="profile-edit-title">Edit username</h2>
          <p class="profile-edit-intro">Change your display name. Points and progress are unchanged.</p>
          <form id="usernameForm" novalidate>
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              required
              minlength="1"
              maxlength="100"
              placeholder="Enter new username"
            />
            <p id="formError" class="form-error" hidden></p>
            <div class="form-actions">
              <button type="submit" class="btn-save" id="btnSave">Save</button>
              <a href="home.html" class="btn-cancel">Cancel</a>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="js/getCurrentURL.js"></script>
    <script src="js/queryCmds.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
