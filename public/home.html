<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detective Noir — Home</title>
    <link
      rel="icon"
      href="/images/sherlock.png?v=2"
      type="image/png"
      sizes="48x48"
    />
    <link
      rel="icon"
      href="/images/sherlock.png?v=2"
      type="image/png"
      sizes="96x96"
    />
    <link rel="apple-touch-icon" href="/images/sherlock.png?v=2" sizes="180x180" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="css/home.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page-backdrop" aria-hidden="true"></div>
    <div class="page-content">
      <header class="home-navbar">
        <span class="brand">Detective Noir</span>
        <div class="d-flex align-items-center">
          <a
            href="profile.html"
            class="profile-link"
            id="profileLink"
            aria-label="View your profile"
          >
            <div class="profile" id="profile">
              <div class="profile-user-block">
                <div class="profile-label">Profile</div>
                <div class="profile-username" id="profileUsername">—</div>
              </div>
              <div>
                <div class="profile-label">Points</div>
                <div class="profile-points" id="profilePoints">0</div>
              </div>
            </div>
          </a>
          <button type="button" class="btn-logout" id="btnLogout">
            Logout
          </button>
        </div>
      </header>

      <main class="main-area" role="main">
        <div class="sherlock-block" id="sherlockBlock">
          <img
            src="images/image.png"
            alt="Sherlock"
            class="sherlock-image"
            width="160"
            height="200"
          />
          <div class="sherlock-dialogue" id="sherlockDialogue">
            <p class="sherlock-dialogue-text" id="sherlockDialogueText">
              Elementary. Pick a case from your desk.
            </p>
          </div>
        </div>
        <div class="home-how-it-works">
          <p class="home-how-step">
            <span class="home-how-num">1</span
            ><span class="home-how-text"
              >Complete <strong>Wellness Quests</strong> to earn points.</span
            >
          </p>
          <p class="home-how-step">
            <span class="home-how-num">2</span
            ><span class="home-how-text"
              >Open a case from the <strong>Case File</strong>, then spend
              points at the crime scene to open storyboxes, collect clues, and
              solve the case.</span
            >
          </p>
        </div>
        <div class="hub-cards">
          <button
            type="button"
            class="hub-card state-btn"
            id="btnCasefile"
            data-idle="images/casefile_active.png"
            data-active="images/casefile_active.png"
            aria-label="Open case file"
          >
            <span class="hub-card-image">
              <img
                src="images/casefile_active.png"
                alt=""
                width="180"
                height="108"
              />
            </span>
          </button>
          <button
            type="button"
            class="hub-card state-btn"
            id="btnWellnessQuests"
            data-idle="images/wellness_quests_active.png"
            data-active="images/wellness_quests_active.png"
            aria-label="To wellness quests"
          >
            <span class="hub-card-image">
              <img
                src="images/wellness_quests_active.png"
                alt=""
                width="180"
                height="108"
              />
            </span>
          </button>
          <button
            type="button"
            class="hub-card state-btn"
            id="btnLeaderboard"
            data-idle="images/leaderboard_active.png"
            data-active="images/leaderboard_active.png"
            aria-label="To leaderboards"
          >
            <span class="hub-card-image">
              <img
                src="images/leaderboard_active.png"
                alt=""
                width="180"
                height="108"
              />
            </span>
          </button>
        </div>
      </main>
    </div>

    <script src="js/getCurrentURL.js"></script>
    <script src="js/queryCmds.js"></script>
    <script src="js/home-page.js"></script>
  </body>
</html>
