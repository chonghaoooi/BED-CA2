<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }

    #login-screen {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-box {
      background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
      padding: 40px; width: 360px;
    }
    .login-box h1 { font-size: 1.4rem; margin-bottom: 24px; color: #fff; text-align: center; }
    .login-box input {
      width: 100%; padding: 10px 14px; margin-bottom: 14px;
      background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
      color: #e0e0e0; font-size: 0.95rem;
    }
    .login-box button {
      width: 100%; padding: 11px; background: #c0392b; border: none;
      border-radius: 6px; color: #fff; font-size: 1rem; cursor: pointer;
    }
    .login-box button:hover { background: #a93226; }
    #login-error { color: #e74c3c; font-size: 0.85rem; margin-top: 10px; text-align: center; }

    #admin-panel { display: none; padding: 30px; max-width: 1000px; margin: 0 auto; }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px;
    }
    .panel-header h1 { font-size: 1.5rem; color: #fff; }
    #logout-btn {
      padding: 8px 18px; background: #333; border: 1px solid #555;
      border-radius: 6px; color: #ccc; cursor: pointer; font-size: 0.9rem;
    }
    #logout-btn:hover { background: #444; }

    .section { margin-bottom: 40px; }
    .section h2 { font-size: 1.1rem; color: #aaa; margin-bottom: 14px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }

    table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
    th { background: #222; padding: 12px 16px; text-align: left; font-size: 0.85rem; color: #888; text-transform: uppercase; }
    td { padding: 12px 16px; border-top: 1px solid #2a2a2a; font-size: 0.92rem; }
    tr:hover td { background: #1f1f1f; }

    .delete-btn {
      padding: 5px 12px; background: #c0392b; border: none;
      border-radius: 4px; color: #fff; cursor: pointer; font-size: 0.82rem;
    }
    .delete-btn:hover { background: #a93226; }
    .delete-btn:disabled { background: #555; cursor: not-allowed; }

    .loading { color: #666; font-size: 0.9rem; padding: 16px; }
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #27ae60; color: #fff; padding: 12px 20px;
      border-radius: 6px; font-size: 0.9rem; display: none;
    }
    #toast.error { background: #c0392b; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔐 Admin Panel</h1>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- PANEL -->
<div id="admin-panel">
  <div class="panel-header">
    <h1>⚙️ Admin Panel</h1>
    <button id="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="section">
    <h2>Users</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Username</th><th>Email</th><th>Points</th><th>Joined</th><th></th></tr>
      </thead>
      <tbody id="users-tbody"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Wellness Challenges</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Description</th><th>Points</th><th></th></tr>
      </thead>
      <tbody id="challenges-tbody"><tr><td colspan="4" class="loading">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script src="js/admin.js"></script>
</body>
</html>
